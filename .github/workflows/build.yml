name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n 1)
          unzip -o "$ZIP"
          FOLDER=$(unzip -Z -1 "$ZIP" | head -n 1 | cut -d/ -f1)
          if [ -d "$FOLDER" ]; then
            cp -r "$FOLDER"/* ./
            rm -rf "$FOLDER"
          fi
          rm -f *.zip
      - name: Fix build.gradle.kts error
        run: |
          cat android/app/build.gradle.kts
          # Fix versionCode and versionName
          sed -i 's/versionCode.*/versionCode = flutterVersionCode.toInt()/g' android/app/build.gradle.kts
          sed -i 's/versionName.*/versionName = flutterVersionName/g' android/app/build.gradle.kts
          # Also fix if using flutter.versionCode style
          sed -i 's/flutterVersionCode.*/val flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"/g' android/app/build.gradle.kts || true
          echo "--- FIXED FILE ---"
          cat android/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - run: flutter clean
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
