name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project correctly
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Zip: $ZIP"
          unzip -o "$ZIP"
          rm -f "$ZIP"
          # Find where pubspec.yaml is
          PUB=$(find . -name "pubspec.yaml" | head -n 1)
          echo "Pubspec found at: $PUB"
          PROJ_DIR=$(dirname "$PUB")
          echo "Project dir: $PROJ_DIR"
          # Move all files to root
          if [ "$PROJ_DIR" != "." ]; then
            cp -r "$PROJ_DIR"/* ./
            cp -r "$PROJ_DIR"/.* ./ 2>/dev/null || true
          fi
          # Clean nested leftovers
          rm -rf hello-world-5
          ls -la
          ls -la android/app/ || true
      - name: Fix build.gradle.kts
        run: |
          # Overwrite wherever it exists
          TARGET="android/app/build.gradle.kts"
          cat > $TARGET << 'EOF'
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }
          val localProperties = java.util.Properties()
          val localPropertiesFile = rootProject.file("local.properties")
          if (localPropertiesFile.exists()) {
              localPropertiesFile.inputStream().use { localProperties.load(it) }
          }
          val flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
          val flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"
          android {
              namespace = "com.example.hello_world_5"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_11
                  targetCompatibility = JavaVersion.VERSION_11
              }
              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_11.toString()
              }
              defaultConfig {
                  applicationId = "com.example.hello_world_5"
                  minSdk = flutter.minSdkVersion
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutterVersionCode.toInt()
                  versionName = flutterVersionName
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }
          }
          flutter {
              source = "../.."
          }
          EOF
          echo "Fixed file:"
          cat $TARGET
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - run: flutter clean
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
