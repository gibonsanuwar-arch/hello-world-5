name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ls -la
          ZIP=$(ls *.zip | head -n 1)
          echo "Found zip: $ZIP"
          unzip -o "$ZIP"
          FOLDER=$(unzip -Z -1 "$ZIP" | head -n 1 | cut -d/ -f1)
          echo "Folder: $FOLDER"
          if [ -d "$FOLDER" ]; then
            cp -r "$FOLDER"/* ./
            rm -rf "$FOLDER"
          fi
          rm -f *.zip
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
