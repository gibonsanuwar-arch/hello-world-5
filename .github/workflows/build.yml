name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: unzip -o hello-world-5.zip
      - run: flutter pub get
        working-directory: "Hello-World (5)"
      - run: flutter build apk --release
        working-directory: "Hello-World (5)"
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: "Hello-World (5)/build/app/outputs/flutter-apk/app-release.apk"
        
