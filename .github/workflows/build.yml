name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n 1)
          unzip -o "$ZIP"
          FOLDER=$(ls -d */ | head -n 1)
          if [ -f "$FOLDER/pubspec.yaml" ]; then
            cp -r "$FOLDER"* ./
            cp -r "$FOLDER".* ./ 2>/dev/null || true
          else
            INNER=$(find . -name "pubspec.yaml" | head -n 1 | xargs dirname)
            cp -r "$INNER"/* ./ 2>/dev/null || true
          fi
          rm -rf "$FOLDER" *.zip __MACOSX
          ls -la
      - name: Fix build.gradle.kts
        run: |
          cat > android/app/build.gradle.kts << 'EOF'
          import java.util.Properties
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }
          val localProperties = Properties()
          val localPropertiesFile = rootProject.file("local.properties")
          if (localPropertiesFile.exists()) {
              localPropertiesFile.inputStream().use { localProperties.load(it) }
          }
          val flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
          val flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"
          android {
              namespace = "com.example.hello_world_5"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_11
                  targetCompatibility = JavaVersion.VERSION_11
              }
              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_11.toString()
              }
              defaultConfig {
                  applicationId = "com.example.hello_world_5"
                  minSdk = flutter.minSdkVersion
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutterVersionCode.toInt()
                  versionName = flutterVersionName
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }
          }
          flutter {
              source = "../.."
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - run: flutter clean
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
